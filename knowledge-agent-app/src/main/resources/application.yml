server:
  port: 8081

spring:
  application:
    name: TCA

  # 本地开发可复制 .env.example 为 .env；同时兼容项目根目录与app模块目录两种启动工作目录
  config.import: "optional:file:.env[.properties],optional:file:../.env[.properties]"

  autoconfigure:
    exclude:
      # 外部工具回调改由 MCP 接入层自建（白名单+来源前缀+故障容错），同时避免自动配置的
      # ToolCallbackProvider 被 /mcp 服务端收集后，把外部工具反向对外暴露
      - org.springframework.ai.mcp.client.common.autoconfigure.McpToolCallbackAutoConfiguration

  datasource:
    # 默认指向docker容器（5433）；宿主5432被本机PostgreSQL 18服务占用，勿改回5432
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:team_collaboration_agent}}
    username: ${POSTGRES_USER:team_collaboration_agent}
    password: ${POSTGRES_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

  ai:
    mcp:
      server:
        protocol: STATELESS
        name: knowledge-agent-mcp
        version: 0.1.0
        # 暴露服务端 @McpTool 注解工具（/mcp 对外提供知识库工具）；客户端工具回调已由
        # autoconfigure.exclude 隔离，不会经此开关泄漏到 /mcp
        tool-callback-converter: true
        stateless:
          mcp-endpoint: /mcp
      client:
        # 接入层：消费外部 MCP Server 工具（仅智能客服 Agent 挂载，见 app.mcp）
        enabled: true
        # 不在启动时连接外部服务：由接入层首次取工具时容错初始化，外部服务故障不拖垮启动
        initialized: false
        name: knowledge-agent
        version: 0.1.0
        request-timeout: 60s
        # 接入示例：在 streamable-http.connections 下新增连接（连接名将作为外部工具名的来源前缀）：
        # streamable-http:
        #   connections:
        #     order-service:
        #       url: http://localhost:18090

    model:
      # 聊天/向量模型均改为应用自建的多级降级链（见 app.ai.chat.levels / app.ai.embedding.levels），关闭自动配置
      chat: none
      embedding: none
      audio.speech: none
      audio.transcription: none
      image: none
      moderation: none

    # 聊天与向量模型均已迁移到 app.ai.chat.levels / app.ai.embedding.levels（多级降级+超时）


app:
  ai:
    # 模型上下文窗口（token），与本地 llama.cpp 启动参数 -c 65536 保持一致
    context-window-tokens: 65536
    # 摘要+活跃历史占窗口比例达到该值时触发压缩（codex 同款 90%）
    compact-trigger-ratio: 0.9
    # 压缩后「新摘要+剩余活跃」的目标占比（活跃侧预留一半，其余留给摘要，实际落点约15%-25%）
    compact-target-ratio: 0.2
    chat:
      # 聊天模型降级链：按顺序尝试，前一级失败（超时/连接失败/空响应）自动降级下一级；
      # 所有对话、摘要与标题生成共用此链，每级带独立超时，不会无限阻塞。
      levels:
        - name: primary
          base-url: ${CHAT_MODEL_BASE_URL:http://localhost:8080}
          api-key: ${CHAT_MODEL_API_KEY:local}
          model: ${CHAT_MODEL_NAME:spark2.5}
          connect-timeout: 10s
          read-timeout: 120s
        # 第二级（示例：主模型不可用时启用，取消注释并填写）：
        # - name: secondary
        #   base-url: ${CHAT_FALLBACK_SECONDARY_BASE_URL:}
        #   api-key: ${CHAT_FALLBACK_SECONDARY_API_KEY:}
        #   model: ${CHAT_FALLBACK_SECONDARY_MODEL:}
        #   connect-timeout: 10s
        #   read-timeout: 60s
        # 第三级（示例）：
        # - name: tertiary
        #   base-url: ${CHAT_FALLBACK_TERTIARY_BASE_URL:}
        #   api-key: ${CHAT_FALLBACK_TERTIARY_API_KEY:}
        #   model: ${CHAT_FALLBACK_TERTIARY_MODEL:}
        #   connect-timeout: 10s
        #   read-timeout: 60s
    embedding:
      # 向量模型降级链：各级必须指向维度一致、向量空间一致的模型（bge-m3 族），否则向量不可比。
      levels:
        - name: primary
          base-url: ${EMBEDDING_MODEL_BASE_URL:https://api.siliconflow.cn}
          api-key: ${EMBEDDING_MODEL_API_KEY:local}
          model: ${EMBEDDING_MODEL_NAME:BAAI/bge-m3}
          connect-timeout: 5s
          read-timeout: 60s
        # 第二级（示例：主向量服务不可用时启用同维度模型服务）：
        # - name: secondary
        #   base-url: ${EMBEDDING_FALLBACK_SECONDARY_BASE_URL:}
        #   api-key: ${EMBEDDING_FALLBACK_SECONDARY_API_KEY:}
        #   model: ${EMBEDDING_FALLBACK_SECONDARY_MODEL:}
        #   connect-timeout: 5s
        #   read-timeout: 60s

  mcp:
    # 外部工具白名单（原始工具名，非加前缀后的名字）；为空时不限制
    tool-whitelist: []
    # 按连接附加的 HTTP 鉴权头，例如：connection-headers.order-service.Authorization=Bearer xxx
    connection-headers: {}
    # 外部服务不可用后的重试冷却时长
    retry-cooldown: 30s

  conversation:
    # 首轮会话标题的最大字符数
    title-max-length: 10
    # 处理锁僵尸超时：一轮对话发起后超过该时长仍未完成，视为失效锁可被下一轮接管
    processing-stale-timeout: 10m

  embedding:
    model-name: BAAI/bge-m3
    dimensions: 1024
    batch-size: 32

  rag:
    # 检索默认返回分块数
    default-top-k: 5
    # 检索允许的最大返回分块数
    max-top-k: 20
    # HNSW候选放大倍数（抵消知识库过滤损耗）
    oversample-factor: 5
    # 调优开关：问题重写（大模型改写查询后再向量化）——实验组开启；基线分支关闭
    query-rewrite-enabled: true
    # 调优开关：向量+关键词混合检索（RRF融合）
    hybrid-search-enabled: true
    # 调优开关：专用重排模型结果重排（bge-reranker-v2-m3，本地 llama.cpp 8083）
    rerank-enabled: true
    # 送入重排的候选数量
    rerank-candidates: 12
    # 重排服务地址（OpenAI 兼容 /v1/rerank 接口）
    rerank-base-url: ${RERANK_MODEL_BASE_URL:http://localhost:8083}
    # 重排模型名称
    rerank-model-name: ${RERANK_MODEL_NAME:bge-reranker-v2-m3}
    # 重排服务读取超时（连接超时固定5秒）
    rerank-timeout: 30s

  text-chunk:
    target-length: 1000
    max-length: 1200
    overlap-length: 100

  file-validation:
    max-file-size-bytes: 52428800
    supported-extensions:
      - pdf
      - docx
      - txt
      - md
    max-filename-length: 255
    text-sample-size: 8192
    max-zip-entries: 2048

  file-storage:
    root-directory: ${APP_FILE_STORAGE_ROOT:./storage}
